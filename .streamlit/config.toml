# Theme for the Coach Dashboard redesign.
# Values come from the design handoff; the full palette ramp (accent tints,
# neutral steps, divider) is derived from these four and lives in app.py's
# _PALETTE so the CSS and the config cannot drift apart.

[theme]
primaryColor = "#ec3013"
backgroundColor = "#f3f2f2"
secondaryBackgroundColor = "#eae9e9"
textColor = "#201e1d"
font = "sans serif"

[server]
headless = true
